---
# role: update
# file: molecule/resources/playbooks/side_effect.yml

- name: UPDATE | Exercise reboot detection and scheduling
  hosts: all
  gather_facts: true
  tasks:
    - name: UPDATE | Determine a safe future test time
      ansible.builtin.command:
        argv: [date, --date, '+12 hours', '+%H:%M']
      changed_when: false
      register: __update_test_time

    - name: UPDATE | Determine a different future test time
      ansible.builtin.command:
        argv: [date, --date, '+13 hours', '+%H:%M']
      changed_when: false
      register: __update_other_time

    - name: UPDATE | Test reboot scheduling with cleanup
      block:
        - name: UPDATE | Exercise native reboot detection after updates
          ansible.builtin.include_role:
            name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            update_reboot: true
            update_reboot_time: '{{ __update_test_time.stdout }}'

        - name: UPDATE | Inspect the Debian reboot schedule
          become: true
          become_user: root
          ansible.builtin.stat:
            path: /run/systemd/shutdown/scheduled
          register: __update_detected_schedule
          when: ansible_facts.os_family == 'Debian'

        - name: UPDATE | Verify that the pending Debian reboot was scheduled
          ansible.builtin.assert:
            that: __update_detected_schedule.stat.exists
            quiet: true
          when: ansible_facts.os_family == 'Debian'

        - name: UPDATE | Exercise scheduling on every platform
          ansible.builtin.include_role:
            name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
            tasks_from: reboot.yml
          vars:
            update_reboot_time: '{{ __update_test_time.stdout }}'

        - name: UPDATE | Read the first shutdown schedule
          become: true
          become_user: root
          ansible.builtin.stat:
            path: /run/systemd/shutdown/scheduled
          register: __update_first_schedule

        - name: UPDATE | Repeat the same reboot schedule
          ansible.builtin.include_role:
            name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
            tasks_from: reboot.yml
          vars:
            update_reboot_time: '{{ __update_test_time.stdout }}'

        - name: UPDATE | Read the repeated shutdown schedule
          become: true
          become_user: root
          ansible.builtin.stat:
            path: /run/systemd/shutdown/scheduled
          register: __update_repeated_schedule

        - name: UPDATE | Verify that an identical schedule was retained
          ansible.builtin.assert:
            that:
              - __update_first_schedule.stat.exists
              - __update_first_schedule.stat.mtime == __update_repeated_schedule.stat.mtime
            quiet: true

        - name: UPDATE | Change the pending reboot time
          ansible.builtin.include_role:
            name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
            tasks_from: reboot.yml
          vars:
            update_reboot_time: '{{ __update_other_time.stdout }}'

        - name: UPDATE | Read the changed shutdown schedule
          become: true
          become_user: root
          ansible.builtin.stat:
            path: /run/systemd/shutdown/scheduled
          register: __update_changed_schedule

        - name: UPDATE | Verify that changing the time replaced the schedule
          ansible.builtin.assert:
            that:
              - __update_first_schedule.stat.checksum != __update_changed_schedule.stat.checksum
            quiet: true
      always:
        - name: UPDATE | Cancel the test shutdown request
          become: true
          become_user: root
          ansible.builtin.command:
            argv: [shutdown, -c]
          changed_when: true

    - name: UPDATE | Exercise immediate reboot and connection recovery
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        tasks_from: reboot.yml
        apply:
          module_defaults:
            ansible.builtin.reboot:
              reboot_command: /usr/local/sbin/update-molecule-reboot
              boot_time_command: cat /run/update-molecule-boot-id
              test_command: cat /run/update-molecule-boot-id
      vars:
        update_reboot_time: now

    - name: UPDATE | Read the simulated boot identity
      ansible.builtin.command:
        argv: [cat, /run/update-molecule-boot-id]
      changed_when: false
      register: __update_boot_identity

    - name: UPDATE | Verify that the immediate reboot action ran
      ansible.builtin.assert:
        that: __update_boot_identity.stdout == 'after-reboot'
        quiet: true
