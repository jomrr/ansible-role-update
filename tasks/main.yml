---
# role: update
# file: tasks/main.yml

- name: UPDATE | Validate platform support
  ansible.builtin.import_tasks: assert.yml

- name: UPDATE | Update packages with the detected package manager
  ansible.builtin.include_tasks:
    file: "{{ 'dnf' if ansible_facts.pkg_mgr == 'dnf5' else ansible_facts.pkg_mgr }}.yml"

- name: UPDATE | Handle pending reboot requests
  ansible.builtin.include_tasks: "reboot-{{ ansible_facts.os_family }}.yml"
  when:
    - update_reboot
    - not ansible_check_mode
